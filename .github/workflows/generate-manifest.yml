name: Generate Manifest

on:
  push:
    branches:
      - Beta
      - main
    paths:
      - package.json

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate manifest
      shell: pwsh
      run: ./.github/scripts/generate_updater_manifest.ps1 -RootPath . -OutputPath updater_manifest.json

      - name: Commit manifest
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add updater_manifest.json
          git diff --staged --quiet || git commit -m "Auto update manifest"
          git push