name: Generate Manifest

on:
  push:
    branches:
      - Beta
      - main
    paths:
      - "package.json"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate manifest
        run: |
          python3 << 'EOF'
          import hashlib
          import json
          import os

          manifest = {
              "version": "",
              "files": {}
          }

          # read version from package.json
          with open("package.json") as f:
              manifest["version"] = json.load(f)["version"]

          for root, dirs, files in os.walk("."):
              if ".git" in root:
                  continue

              for file in files:

                  if file.endswith(".meta"):
                      continue

                  if file == "updater_manifest.json":
                      continue

                  path = os.path.join(root, file)

                  rel = os.path.relpath(path, ".").replace("\\","/")

                  with open(path,"rb") as f:
                      sha = hashlib.sha1(f.read()).hexdigest()

                  manifest["files"][rel] = sha

          with open("updater_manifest.json","w") as f:
              json.dump(manifest,f,indent=2)
          EOF

      - name: Commit manifest
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add updater_manifest.json

          git diff --staged --quiet || git commit -m "Auto update manifest"

          git push