name: Generate Manifest

on:
  push:
    branches:
      - Beta
      - main
    paths:
      - package.json

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate manifest
        shell: bash
        run: |
          python3 <<'PY'
          import hashlib
          import json
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path('.').resolve()
          output_path = root / 'updater_manifest.json'

          package_path = root / 'package.json'
          if not package_path.exists():
              raise FileNotFoundError(f'package.json not found at {package_path}')

          with package_path.open('r', encoding='utf-8') as handle:
              package = json.load(handle)

          version = package.get('version')
          if not version:
              raise ValueError('package.json is missing a version field')

          def normalize_relative(path: pathlib.Path) -> str:
              return path.relative_to(root).as_posix()

          def is_explicitly_skipped(relative_path: str) -> bool:
              if not relative_path:
                  return True
              if relative_path.endswith('.meta'):
                  return True
              if relative_path.startswith(('.git/', '.github/', '.vscode/', '.idea/')):
                  return True
              if pathlib.PurePosixPath(relative_path).name.startswith('updater_manifest') and relative_path.endswith('.json'):
                  return True
              if relative_path == output_path.relative_to(root).as_posix():
                  return True
              return False

          def is_git_ignored(relative_path: str) -> bool:
              result = subprocess.run(
                  ['git', '-C', str(root), 'check-ignore', '--no-index', '--quiet', '--', relative_path],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              )
              return result.returncode == 0

          files = {}
          for file_path in root.rglob('*'):
              if not file_path.is_file():
                  continue

              relative_path = normalize_relative(file_path)
              if is_explicitly_skipped(relative_path):
                  continue
              if is_git_ignored(relative_path):
                  continue

              with file_path.open('rb') as handle:
                  files[relative_path] = hashlib.sha1(handle.read()).hexdigest()

          if not files:
              raise RuntimeError('No files were collected for updater_manifest.json')

          manifest = {
              'version': version,
              'files': dict(sorted(files.items())),
          }

          with output_path.open('w', encoding='utf-8', newline='\n') as handle:
              json.dump(manifest, handle, indent=2)
              handle.write('\n')

          print(f'Generated updater_manifest.json with {len(files)} files for version {version}')
          PY

      - name: Commit manifest
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add updater_manifest.json
          git diff --staged --quiet || git commit -m "Auto update manifest"
          git push