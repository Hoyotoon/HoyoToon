name: Generate Manifest

on:
  push:
    branches:
      - Beta
      - main
    paths:
      - package.json

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Get-NormalizedRelativePath {
            param(
              [string]$BasePath,
              [string]$Path
            )

            $baseFullPath = [System.IO.Path]::GetFullPath($BasePath)
            $targetFullPath = [System.IO.Path]::GetFullPath($Path)
            if (-not $baseFullPath.EndsWith([System.IO.Path]::DirectorySeparatorChar.ToString())) {
              $baseFullPath += [System.IO.Path]::DirectorySeparatorChar
            }

            $baseUri = [System.Uri]::new($baseFullPath)
            $targetUri = [System.Uri]::new($targetFullPath)
            $relative = [System.Uri]::UnescapeDataString($baseUri.MakeRelativeUri($targetUri).ToString())
            return $relative.Replace('\\', '/')
          }

          function Test-IsExplicitlySkipped {
            param(
              [string]$RelativePath,
              [string]$OutputRelativePath
            )

            if ([string]::IsNullOrWhiteSpace($RelativePath)) {
              return $true
            }

            if ($RelativePath.EndsWith('.meta', [System.StringComparison]::OrdinalIgnoreCase)) {
              return $true
            }

            if ($RelativePath.StartsWith('.git/', [System.StringComparison]::OrdinalIgnoreCase) -or
              $RelativePath.StartsWith('.github/', [System.StringComparison]::OrdinalIgnoreCase) -or
              $RelativePath.StartsWith('.vscode/', [System.StringComparison]::OrdinalIgnoreCase) -or
              $RelativePath.StartsWith('.idea/', [System.StringComparison]::OrdinalIgnoreCase)) {
              return $true
            }

            $fileName = [System.IO.Path]::GetFileName($RelativePath)
            if ($fileName -like 'updater_manifest*.json') {
              return $true
            }

            if ($RelativePath.Equals($OutputRelativePath, [System.StringComparison]::OrdinalIgnoreCase)) {
              return $true
            }

            return $false
          }

          function Test-IsIgnoredByGit {
            param(
              [string]$RepoRoot,
              [string]$RelativePath
            )

            & git -C $RepoRoot check-ignore --no-index --quiet -- $RelativePath
            return $LASTEXITCODE -eq 0
          }

          $resolvedRoot = [System.IO.Path]::GetFullPath(".")
          $resolvedOutput = [System.IO.Path]::GetFullPath((Join-Path $resolvedRoot "updater_manifest.json"))
          $outputRelative = Get-NormalizedRelativePath -BasePath $resolvedRoot -Path $resolvedOutput

          $package = Get-Content -LiteralPath "package.json" -Raw | ConvertFrom-Json
          $files = Get-ChildItem -LiteralPath $resolvedRoot -File -Recurse

          $entries = New-Object System.Collections.Generic.List[object]
          foreach ($file in $files) {
            $relativePath = Get-NormalizedRelativePath -BasePath $resolvedRoot -Path $file.FullName

            if (Test-IsExplicitlySkipped -RelativePath $relativePath -OutputRelativePath $outputRelative) {
              continue
            }

            if (Test-IsIgnoredByGit -RepoRoot $resolvedRoot -RelativePath $relativePath) {
              continue
            }

            $hash = (Get-FileHash -Algorithm SHA1 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            $entries.Add([pscustomobject]@{
              Key = $relativePath
              Value = $hash
            })
          }

          $sortedEntries = $entries | Sort-Object Key
          $fileMap = [ordered]@{}
          foreach ($entry in $sortedEntries) {
            $fileMap[$entry.Key] = $entry.Value
          }

          $manifest = [ordered]@{
            version = $package.version
            files = $fileMap
          }

          $manifest | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath "updater_manifest.json"

      - name: Commit manifest
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add updater_manifest.json
          git diff --staged --quiet || git commit -m "Auto update manifest"
          git push